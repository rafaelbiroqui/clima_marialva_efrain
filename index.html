<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=1536,height=1024,initial-scale=1">

<title>Previsão do Tempo - Marialva</title>


<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
   RESOLUÇÃO: 1536 × 1024
   PROPORÇÃO: 3:2
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 1536px;
    height: 1024px;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #F5F7F9;

    color: #142536;

}


/* =========================================================
   ÁREA PRINCIPAL
========================================================= */

#app {

    position: relative;

    width: 1536px;
    height: 1024px;

    overflow: hidden;

    background: #F5F7F9;

}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {

    width: 100%;

    height: 180px;

    padding:
        0
        48px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #123B5D;

    color: #FFFFFF;

}


.city {

    font-size: 78px;

    font-weight: 900;

    letter-spacing: 1px;

    line-height: 1;

}


.clock {

    font-size: 48px;

    font-weight: 700;

    line-height: 1.05;

    text-align: right;

}


/* =========================================================
   CLIMA ATUAL
========================================================= */

.current {

    width: 100%;

    height: 425px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #FFFFFF;

}


/* =========================================================
   ÍCONE PRINCIPAL
========================================================= */

.current-icon {

    width: 410px;

    font-size: 275px;

    line-height: 1;

    text-align: center;

}


/* =========================================================
   BLOCO DA TEMPERATURA
========================================================= */

.current-temperature {

    width: 600px;

    text-align: left;

}


/* TEMPERATURA */

.temperature {

    font-size: 235px;

    line-height: 0.85;

    font-weight: 900;

    letter-spacing: -12px;

    color: #123B5D;

}


/* MÁXIMA / MÍNIMA */

.minmax {

    margin-top: 42px;

    margin-left: 12px;

    font-size: 72px;

    line-height: 1;

    font-weight: 800;

    color: #526574;

}


/* =========================================================
   ÁREA DA PREVISÃO
========================================================= */

.forecast {

    width: 100%;

    height: 419px;

    padding:
        28px
        20px
        20px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    background: #E9EFF4;

}


/* =========================================================
   CADA DIA
========================================================= */

.day {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: space-between;

    padding:
        5px
        20px
        20px;

    border-right:
        3px solid #CCD7E0;

}


.day:last-child {

    border-right: none;

}


/* =========================================================
   NOME DO DIA
========================================================= */

.day-name {

    height: 55px;

    font-size: 45px;

    font-weight: 900;

    color: #274C67;

    line-height: 1;

    text-align: center;

}


/* =========================================================
   ÍCONE DO DIA
========================================================= */

.day-icon {

    height: 125px;

    font-size: 105px;

    line-height: 1;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   TEMPERATURA DO DIA
========================================================= */

.day-temperature {

    font-size: 52px;

    font-weight: 900;

    line-height: 1;

    color: #172B3B;

    white-space: nowrap;

}


/* =========================================================
   PROBABILIDADE DE CHUVA
========================================================= */

.day-rain {

    font-size: 43px;

    font-weight: 800;

    line-height: 1;

    color: #2473A6;

}


/* =========================================================
   ERRO / OFFLINE
========================================================= */

#error {

    display: none;

    position: absolute;

    bottom: 12px;

    left: 20px;

    font-size: 18px;

    color: #B43D32;

}


</style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="header">


        <div class="city">

            MARIALVA • PR

        </div>


        <div
            class="clock"
            id="clock">

            --:--

        </div>


    </div>



    <!-- =====================================================
         CLIMA ATUAL
    ====================================================== -->

    <div class="current">


        <div
            class="current-icon"
            id="currentIcon">

            ☀️

        </div>


        <div
            class="current-temperature">


            <div
                class="temperature"
                id="temperature">

                --°

            </div>


            <div
                class="minmax"
                id="minmax">

                --° / --°

            </div>


        </div>


    </div>



    <!-- =====================================================
         PREVISÃO
    ====================================================== -->

    <div
        class="forecast"
        id="forecast">

    </div>



    <!-- =====================================================
         MENSAGEM DE ERRO
    ====================================================== -->

    <div
        id="error">

        Sem conexão

    </div>


</div>



<script>


/* =========================================================
   API OPEN-METEO
========================================================= */

const API =

    "https://api.open-meteo.com/v1/forecast"

    +

    "?latitude=-23.485"

    +

    "&longitude=-51.792"

    +

    "&current="

    +

    "temperature_2m,"

    +

    "apparent_temperature,"

    +

    "relative_humidity_2m,"

    +

    "weather_code,"

    +

    "wind_speed_10m"

    +

    "&daily="

    +

    "weather_code,"

    +

    "temperature_2m_max,"

    +

    "temperature_2m_min,"

    +

    "precipitation_probability_max"

    +

    "&timezone=America%2FSao_Paulo"

    +

    "&forecast_days=5";



/* =========================================================
   CONDIÇÕES METEOROLÓGICAS
========================================================= */

const weather = {


    0: [
        "☀️",
        "CÉU LIMPO"
    ],


    1: [
        "🌤️",
        "LIMPO"
    ],


    2: [
        "⛅",
        "PARCIALMENTE NUBLADO"
    ],


    3: [
        "☁️",
        "NUBLADO"
    ],


    45: [
        "🌫️",
        "NEBLINA"
    ],


    48: [
        "🌫️",
        "NEBLINA"
    ],


    51: [
        "🌦️",
        "GAROA"
    ],


    53: [
        "🌦️",
        "GAROA"
    ],


    55: [
        "🌧️",
        "GAROA"
    ],


    61: [
        "🌧️",
        "CHUVA"
    ],


    63: [
        "🌧️",
        "CHUVA"
    ],


    65: [
        "🌧️",
        "CHUVA"
    ],


    66: [
        "🌧️",
        "CHUVA"
    ],


    67: [
        "🌧️",
        "CHUVA"
    ],


    71: [
        "❄️",
        "NEVE"
    ],


    73: [
        "❄️",
        "NEVE"
    ],


    75: [
        "❄️",
        "NEVE"
    ],


    77: [
        "❄️",
        "NEVE"
    ],


    80: [
        "🌦️",
        "PANCADAS"
    ],


    81: [
        "🌧️",
        "PANCADAS"
    ],


    82: [
        "⛈️",
        "PANCADAS"
    ],


    85: [
        "❄️",
        "NEVE"
    ],


    86: [
        "❄️",
        "NEVE"
    ],


    95: [
        "⛈️",
        "TROVOADA"
    ],


    96: [
        "⛈️",
        "TROVOADA"
    ],


    99: [
        "⛈️",
        "TROVOADA"
    ]

};



/* =========================================================
   RETORNA INFORMAÇÕES DA CONDIÇÃO
========================================================= */

function weatherInfo(code) {

    return weather[code]

        ||

        [
            "🌤️",
            "VARIÁVEL"
        ];

}



/* =========================================================
   NOME DOS DIAS
========================================================= */

function getDayName(
    dateString,
    index
) {


    if (index === 0) {

        return "HOJE";

    }


    if (index === 1) {

        return "AMANHÃ";

    }


    return new Date(
        dateString +
        "T12:00:00"
    )

        .toLocaleDateString(
            "pt-BR",
            {
                weekday: "short"
            }
        )

        .replace(
            ".",
            ""
        )

        .toUpperCase();

}



/* =========================================================
   RELÓGIO
========================================================= */

function updateClock() {


    const now =
        new Date();


    const time =

        now.toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const date =

        now.toLocaleDateString(
            "pt-BR",
            {
                day: "2-digit",
                month: "2-digit"
            }
        );


    document.getElementById(
        "clock"
    ).innerHTML =

        time

        +

        "<br>"

        +

        date;

}


updateClock();


setInterval(
    updateClock,
    30000
);



/* =========================================================
   CACHE LOCAL
========================================================= */

function saveWeather(data) {

    try {

        localStorage.setItem(
            "marialva_weather",
            JSON.stringify(data)
        );

    }

    catch (e) {}

}



function loadWeather() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "marialva_weather"
            )
        );

    }

    catch (e) {

        return null;

    }

}



/* =========================================================
   RENDERIZA OS DADOS
========================================================= */

function render(data) {


    const current =
        data.current;


    const daily =
        data.daily;


    const currentInfo =
        weatherInfo(
            current.weather_code
        );


    /* =====================================================
       ÍCONE ATUAL
    ===================================================== */

    document.getElementById(
        "currentIcon"
    ).textContent =

        currentInfo[0];



    /* =====================================================
       TEMPERATURA ATUAL
    ===================================================== */

    document.getElementById(
        "temperature"
    ).textContent =

        Math.round(
            current.temperature_2m
        )

        +

        "°";



    /* =====================================================
       MÁXIMA / MÍNIMA
    ===================================================== */

    document.getElementById(
        "minmax"
    ).textContent =

        Math.round(
            daily.temperature_2m_max[0]
        )

        +

        "° / "

        +

        Math.round(
            daily.temperature_2m_min[0]
        )

        +

        "°";



    /* =====================================================
       PREVISÃO
    ===================================================== */

    let html = "";



    for (
        let i = 0;
        i < 4;
        i++
    ) {


        const info =
            weatherInfo(
                daily.weather_code[i]
            );


        const max =

            Math.round(
                daily.temperature_2m_max[i]
            );


        const min =

            Math.round(
                daily.temperature_2m_min[i]
            );


        const rain =

            Math.round(
                daily
                    .precipitation_probability_max[i]
                ||
                0
            );



        html += `

            <div class="day">


                <div class="day-name">

                    ${getDayName(
                        daily.time[i],
                        i
                    )}

                </div>


                <div class="day-icon">

                    ${info[0]}

                </div>


                <div class="day-temperature">

                    ${max}° / ${min}°

                </div>


                <div class="day-rain">

                    ${rain}%

                </div>


            </div>

        `;

    }



    document.getElementById(
        "forecast"
    ).innerHTML = html;

}



/* =========================================================
   ATUALIZA PREVISÃO
========================================================= */

async function updateWeather() {


    try {


        const response =

            await fetch(
                API +
                "&_=" +
                Date.now(),

                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Erro HTTP"
            );

        }


        const data =
            await response.json();


        render(data);


        saveWeather(data);


        document.getElementById(
            "error"
        ).style.display =
            "none";


    }

    catch (error) {


        console.log(
            "Erro ao atualizar:",
            error
        );


        const cached =
            loadWeather();


        if (cached) {

            render(cached);

        }


        document.getElementById(
            "error"
        ).style.display =
            "block";

    }

}



/* =========================================================
   INICIALIZAÇÃO
========================================================= */

updateWeather();



/* Atualiza a previsão a cada 10 minutos */

setInterval(
    updateWeather,
    10 * 60 * 1000
);


</script>


</body>

</html>
